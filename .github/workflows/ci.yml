name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest ruff
      - name: Run tests
        run: python -m pytest -q
      - name: Lint search and agent files
        run: ruff check nally/agent/graph.py nally/tools/web.py tests/test_search_fast_path.py tests/test_web_search_providers.py
